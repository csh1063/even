<svg width="680" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>온보딩 1 - 사진 분석</title>
<defs>
  <linearGradient id="scan-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFC96B" stop-opacity="0"/>
    <stop offset="100%" stop-color="#FFC96B" stop-opacity="0.18"/>
  </linearGradient>
  <clipPath id="photo-clip">
    <rect x="120" y="50" width="440" height="290" rx="18"/>
  </clipPath>
</defs>
<style>
  .sky { fill: #1A3A5C; }
  .mtn1 { fill: #2A5A7A; }
  .mtn2 { fill: #1A4560; }
  .sun { fill: #FFC96B; }
  .sun-ray { stroke: #FFC96B; stroke-width: 2; opacity: 0.45; }
  .corner { stroke: #FFC96B; stroke-width: 2.5; fill: none; stroke-linecap: round; }
  .bubble { fill: #FFF9F5; }
  .bubble-t { fill: #2C2522; font-size: 13px; font-family: sans-serif; font-weight: 600; }
  .divider-line { stroke: #FFC96B; stroke-width: 2.5; }
  .divider-dot { fill: #FFC96B; }
  @media (prefers-color-scheme: dark) {
    .sky { fill: #0E2030; }
    .mtn1 { fill: #1A3848; }
    .mtn2 { fill: #102838; }
    .sun { fill: #FFD37F; }
    .sun-ray { stroke: #FFD37F; }
    .corner { stroke: #FFD37F; }
    .bubble { fill: #1D1816; }
    .bubble-t { fill: #F8F3EF; }
    .divider-line { stroke: #FFD37F; }
    .divider-dot { fill: #FFD37F; }
  }
</style>
<rect x="120" y="50" width="440" height="290" rx="18" class="sky"/>
<polygon points="120,335 265,185 410,335" class="mtn1"/>
<polygon points="310,335 455,175 580,335" class="mtn2"/>
<line x1="488" y1="66" x2="488" y2="53" class="sun-ray"/>
<line x1="488" y1="134" x2="488" y2="147" class="sun-ray"/>
<line x1="450" y1="100" x2="437" y2="100" class="sun-ray"/>
<line x1="526" y1="100" x2="539" y2="100" class="sun-ray"/>
<line x1="462" y1="72" x2="452" y2="62" class="sun-ray"/>
<line x1="514" y1="72" x2="524" y2="62" class="sun-ray"/>
<circle cx="488" cy="100" r="36" class="sun"/>
<rect x="120" y="50" width="440" height="145" fill="url(#scan-grad)" clip-path="url(#photo-clip)"/>
<line x1="120" y1="195" x2="560" y2="195" class="divider-line"/>
<circle cx="120" cy="195" r="5" class="divider-dot"/>
<circle cx="560" cy="195" r="5" class="divider-dot"/>
<rect x="316" y="188" width="48" height="14" rx="7" class="divider-dot" opacity="0.9"/>
<path d="M120,95 L120,50 L165,50" class="corner"/>
<path d="M560,95 L560,50 L515,50" class="corner"/>
<path d="M120,295 L120,340 L165,340" class="corner"/>
<path d="M560,295 L560,340 L515,340" class="corner"/>
